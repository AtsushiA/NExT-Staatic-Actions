name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  phpcs:
    name: phpcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-interaction
      - run: composer run phpcs

  phpunit:
    name: "PHPUnit (WP ${{ matrix.wp }} / PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # Pre-creates the DB so install-wp-tests.sh's SKIP_DB_CREATE=true
          # (below) has an existing database to point WordPress at.
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: "8.3"
          - wp: latest
            php: "8.4"
          - wp: latest
            php: "7.4"
          - wp: "6.8"
            php: "8.3"
          - wp: "6.8"
            php: "8.4"
          - wp: "6.8"
            php: "7.4"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli
      - name: Install Composer dependencies
        run: composer install --no-interaction
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }} true
      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: vendor/bin/phpunit --bootstrap tests/phpunit/bootstrap.php

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wordpress/plugin-check-action@v1
        with:
          # Without this, Plugin Check infers the expected text domain from
          # the checkout directory name (this repo's name, "NExT-Staatic-
          # Actions") instead of the actual plugin slug, and flags every
          # translation call as a text-domain mismatch.
          slug: next-staatic-actions
          # vendor / tests / bin are not part of the shipped plugin.
          exclude-directories: "vendor,tests,node_modules,bin"
          # Not distributed via wp.org, so the plugin_repo category doesn't apply.
          categories: |
            general
            performance
            accessibility
            security
